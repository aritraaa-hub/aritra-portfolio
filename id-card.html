<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aritra Tarafder · ID Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ===== Change the look here ===== */
    :root {
      --accent: #ff3b2f;   /* strap, job title, REC dot */
      --cream: #f7f5f1;    /* card colour */
      --ink: #141312;      /* text on the card */
      --bg: #121110;       /* page background */
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: #fbf9f5; font-family: "Geist", system-ui, sans-serif; overflow: hidden; }

    /* The stage is where the card can move. The strap hangs from its top edge. */
    .stage { position: fixed; inset: 0; }
    .lanyard { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .lanyard__strap { fill: none; stroke: var(--accent); stroke-width: 22; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
    .lanyard__text { font-family: "Geist Mono", monospace; font-size: 10px; font-weight: 500; letter-spacing: .18em; fill: rgba(251,249,245,.92); dominant-baseline: central; }
    .hint { position: absolute; font: 500 11px "Geist Mono", monospace; text-transform: uppercase; letter-spacing: .1em; color: #6d6861; transform: translateX(-50%); white-space: nowrap; transition: opacity .6s; opacity: 0; pointer-events: none; }
    .hint.show { opacity: 1; }

    /* ===== The card ===== */
    .card {
      position: absolute; top: 0; left: 0; width: 250px; height: 380px;
      transform-origin: 0 0; will-change: transform; touch-action: none; cursor: grab;
      user-select: none; -webkit-user-select: none; visibility: hidden;
    }
    .card.ready { visibility: visible; }
    .card.dragging { cursor: grabbing; }
    .card__inner {
      position: absolute; inset: 0; border-radius: 22px; padding: 34px 18px 16px; overflow: hidden;
      display: flex; flex-direction: column; color: var(--ink);
      background: radial-gradient(120% 80% at 0% 0%, #fff 0%, transparent 60%), var(--cream);
      box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 -2px 0 rgba(0,0,0,.06) inset, 0 30px 60px -20px rgba(0,0,0,.7), 0 10px 20px -10px rgba(0,0,0,.5);
      transform-style: preserve-3d;
    }
    /* film perforations down both sides */
    .card__inner::before, .card__inner::after {
      content: ""; position: absolute; top: 40px; bottom: 40px; width: 6px;
      background: radial-gradient(circle, rgba(14,13,12,.14) 2px, transparent 2.5px) 0 0 / 6px 12px repeat-y;
    }
    .card__inner::before { right: 6px; } .card__inner::after { left: 6px; }
    .card__slot { position: absolute; top: 12px; left: 50%; width: 46px; height: 9px; margin-left: -23px; border-radius: 9px; background: var(--bg); box-shadow: inset 0 2px 3px rgba(0,0,0,.6); }
    .card__clip { position: absolute; top: -26px; left: 50%; width: 30px; height: 40px; margin-left: -15px; z-index: 3; border-radius: 6px 6px 8px 8px; background: linear-gradient(90deg, #8d8a85, #e9e6e1 45%, #a9a6a0 60%, #6f6c68); box-shadow: 0 4px 6px rgba(0,0,0,.35); }
    .card__clip span { position: absolute; left: 50%; bottom: 8px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; border: 3px solid #5d5a56; }
    .card__head { display: flex; justify-content: space-between; align-items: center; font: 500 10px "Geist Mono", monospace; letter-spacing: .14em; color: rgba(14,13,12,.55); margin-bottom: 10px; padding: 0 4px; }
    .card__rec { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); }
    .card__rec i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.1s infinite; }
    @keyframes blink { 50% { opacity: .2; } }
    .card__photo { position: relative; flex: 1; min-height: 0; border-radius: 14px; overflow: hidden; background: radial-gradient(90% 70% at 50% 100%, rgba(255,59,47,.55), transparent 70%), linear-gradient(180deg, #ece8e1, #d9d4cb); }
    /* move/zoom your photo inside the frame with top and width */
    .card__photo img { position: absolute; left: 50%; top: -4%; width: 120%; max-width: none; transform: translateX(-50%); pointer-events: none; }
    .card__corner { position: absolute; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.75); }
    .tl { top: 8px; left: 8px; border-right: 0; border-bottom: 0; } .tr { top: 8px; right: 8px; border-left: 0; border-bottom: 0; }
    .bl { bottom: 8px; left: 8px; border-right: 0; border-top: 0; } .br { bottom: 8px; right: 8px; border-left: 0; border-top: 0; }
    /* smaller type so the 3-part job title fits on one line */
    .card__role { font: 500 9px "Geist Mono", monospace; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; color: var(--accent); margin-top: 14px; padding: 0; }
    /* name on two lines: first name, then surname */
    .card__name { font-size: 32px; font-weight: 600; letter-spacing: -0.055em; line-height: .95; padding: 4px 4px 0; white-space: pre-line; }
    .card__foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding: 0 4px; }
    .card__code { font: 500 9px "Geist Mono", monospace; letter-spacing: .1em; color: rgba(14,13,12,.45); }
    .card__bars { width: 70px; height: 18px; opacity: .8; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 3px, var(--ink) 3px 4px, transparent 4px 7px, var(--ink) 7px 10px, transparent 10px 11px); }
    /* holographic sheen, moved by the script while the card swings */
    .card__holo { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; mix-blend-mode: color-dodge; opacity: .55; background: linear-gradient(115deg, transparent 20%, rgba(255,0,128,.25) 35%, rgba(0,220,255,.28) 45%, rgba(255,230,0,.22) 55%, transparent 70%); background-size: 250% 250%; background-position: var(--gx, 50%) var(--gy, 50%); }
    .replay { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); font: 500 13px "Geist", sans-serif; color: #fbf9f5; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); padding: 10px 18px; border-radius: 999px; cursor: pointer; }

    /* phones: a smaller card */
    @media (max-width: 600px) {
      .card { width: 210px; height: 330px; }
      .card__inner { padding: 30px 14px 14px; }
      .card__name { font-size: 27px; }
      .card__role { font-size: 7.5px; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <svg class="lanyard" aria-hidden="true">
      <path id="strapPath" class="lanyard__strap" d="" />
      <!-- the text that runs along the strap -->
      <text class="lanyard__text"><textPath href="#strapPath" id="strapText"></textPath></text>
    </svg>

    <div class="card" id="card" role="img" aria-label="ID card. You can drag it.">
      <div class="card__inner">
        <div class="card__clip" aria-hidden="true"><span></span></div>
        <div class="card__slot" aria-hidden="true"></div>
        <div class="card__head"><span>CREW PASS</span><span class="card__rec"><i></i>REC</span></div>
        <div class="card__photo">
          <img id="cardPhoto" alt="" draggable="false" />
          <span class="card__corner tl"></span><span class="card__corner tr"></span>
          <span class="card__corner bl"></span><span class="card__corner br"></span>
        </div>
        <div class="card__role" id="cardRole"></div>
        <div class="card__name" id="cardName"></div>
        <div class="card__foot" aria-hidden="true"><span class="card__code" id="cardCode"></span><span class="card__bars"></span></div>
        <div class="card__holo" aria-hidden="true"></div>
      </div>
    </div>
    <p class="hint" id="hint">Grab the card ↑</p>
  </div>
  <button class="replay" id="replay" type="button">Drop it again</button>

  <script>
  /* ===== Change your details here ===== */
  const CONFIG = {
    name: "Aritra\nTarafder",                      // \n puts the surname on a second line
    role: "Video Editor · Designer · Developer",
    code: "ID · 2026 · AT-01",
    photo: "assets/me-front.webp",                 // your face photo, any size
    strapText: "CREATIVE • ARITRA TARAFDER • ",    // repeated along the strap
    anchorX: 0.5,                                  // where the strap hangs from: 0 = left edge, 1 = right edge
  };

  /* ===== Physics: a rope made of points (Verlet integration) =====
     The strap is 12 points joined by "sticks". Every frame each point keeps its speed, gravity pulls it down,
     then the sticks are fixed back to their length. The card is 4 more points held in a rigid rectangle. */
  const SEGMENTS = 12;    // points in the strap
  const GRAVITY = 0.55;   // higher = heavier, faster drop
  const DAMPING = 0.982;  // lower = stops swinging sooner
  const MAX_SPEED = 16;   // speed limit so a hard throw can't fling the card off screen
  const CLIP_GAP = 16;

  const $ = (s) => document.querySelector(s);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // fill in the card
  $("#cardName").textContent = CONFIG.name;
  $("#cardRole").textContent = CONFIG.role;
  $("#cardCode").textContent = CONFIG.code;
  $("#cardPhoto").src = CONFIG.photo;
  $("#strapText").textContent = CONFIG.strapText.repeat(8);

  const stage = $("#stage"), card = $("#card"), inner = $(".card__inner"), holo = $(".card__holo"), strap = $("#strapPath"), hint = $("#hint");
  let W, H, anchor, segLen, pts = [], cons = [], drag = null, hasDragged = false, settled = 0;

  function build() {
    W = card.offsetWidth; H = card.offsetHeight;
    const sh = stage.clientHeight;
    const restTop = Math.max(110, (sh - H) / 2 - 20);      // where the card ends up
    const ropeLen = Math.max(60, restTop - CLIP_GAP + 20);
    anchor = { x: stage.clientWidth * CONFIG.anchorX, y: -20 };
    segLen = ropeLen / SEGMENTS;
    pts = []; cons = [];
    // start high above the screen so it drops in
    const lift = reduceMotion ? 0 : ropeLen + H + 60, sway = reduceMotion ? 0 : 90;
    for (let i = 0; i <= SEGMENTS; i++) {
      const t = i / SEGMENTS, x = anchor.x + sway * t, y = anchor.y + i * segLen - lift * t;
      pts.push({ x, y, px: x, py: y, w: i === 0 ? 0 : 1 }); // w = 0 means pinned (the anchor)
    }
    const clip = pts[SEGMENTS], top = clip.y + CLIP_GAP, cx = clip.x + (reduceMotion ? 0 : 30);
    [[cx - W / 2, top], [cx + W / 2, top], [cx + W / 2, top + H], [cx - W / 2, top + H]]
      .forEach(([x, y]) => pts.push({ x, y, px: x, py: y, w: 0.35 }));
    const [TL, TR, BR, BL] = [SEGMENTS + 1, SEGMENTS + 2, SEGMENTS + 3, SEGMENTS + 4];
    // strap: may go slack but never stretches (the jerk when it goes tight makes the bounce)
    for (let i = 0; i < SEGMENTS; i++) cons.push({ a: i, b: i + 1, len: segLen, stretchOnly: true });
    // clip to the two top corners, then a rigid card
    const d = Math.hypot(W / 2, CLIP_GAP), diag = Math.hypot(W, H);
    cons.push({ a: SEGMENTS, b: TL, len: d }, { a: SEGMENTS, b: TR, len: d },
      { a: TL, b: TR, len: W }, { a: TR, b: BR, len: H }, { a: BR, b: BL, len: W }, { a: BL, b: TL, len: H },
      { a: TL, b: BR, len: diag }, { a: TR, b: BL, len: diag });
    card.classList.add("ready");
  }

  const corners = () => pts.slice(SEGMENTS + 1, SEGMENTS + 5);

  function solve() {
    for (const c of cons) {
      const A = pts[c.a], B = pts[c.b];
      const dx = B.x - A.x, dy = B.y - A.y, dist = Math.hypot(dx, dy) || 0.0001;
      if (c.stretchOnly && dist <= c.len) continue;
      const diff = (dist - c.len) / dist, wsum = A.w + B.w;
      if (!wsum) continue;
      A.x += dx * diff * (A.w / wsum); A.y += dy * diff * (A.w / wsum);
      B.x -= dx * diff * (B.w / wsum); B.y -= dy * diff * (B.w / wsum);
    }
  }

  // a point on the card from (u, v) = (0..1 across, 0..1 down)
  function bilinear(u, v) {
    const [a, b, c, d] = corners();
    return {
      x: (1-u)*(1-v)*a.x + u*(1-v)*b.x + u*v*c.x + (1-u)*v*d.x,
      y: (1-u)*(1-v)*a.y + u*(1-v)*b.y + u*v*c.y + (1-u)*v*d.y,
      w: [(1-u)*(1-v), u*(1-v), u*v, (1-u)*v],
    };
  }

  function step() {
    for (const p of pts) {
      if (!p.w) continue;
      const vx = clamp((p.x - p.px) * DAMPING, -MAX_SPEED, MAX_SPEED);
      const vy = clamp((p.y - p.py) * DAMPING, -MAX_SPEED, MAX_SPEED);
      p.px = p.x; p.py = p.y;
      p.x += vx; p.y += vy + GRAVITY;
    }
    if (drag) { // pull the grabbed spot of the card toward the pointer
      const g = bilinear(drag.u, drag.v), dx = drag.x - g.x, dy = drag.y - g.y;
      corners().forEach((p, i) => { const k = g.w[i] * 1.6; p.x += dx * k; p.y += dy * k; p.px = lerp(p.px, p.x, 0.25); p.py = lerp(p.py, p.y, 0.25); });
    }
    for (let i = 0; i < 14; i++) solve();
  }

  function render() {
    const [TL, TR, , BL] = corners();
    const ax = (TR.x - TL.x) / W, ay = (TR.y - TL.y) / W, bx = (BL.x - TL.x) / H, by = (BL.y - TL.y) / H;
    card.style.transform = `matrix(${ax},${ay},${bx},${by},${TL.x},${TL.y})`;
    // small 3D tilt from how fast the card moves
    const cxv = (TL.x - TL.px + TR.x - TR.px) / 2, cyv = (TL.y - TL.py + BL.y - BL.py) / 2;
    const ry = clamp(cxv * 2.2, -40, 40), rx = clamp(-cyv * 1.2, -25, 25);
    inner.style.transform = `perspective(900px) rotateY(${ry}deg) rotateX(${rx}deg)`;
    holo.style.setProperty("--gx", `${50 + ry * 1.5 + Math.atan2(ay, ax) * 60}%`);
    holo.style.setProperty("--gy", `${50 + rx * 1.5}%`);
    // strap: a smooth curve through the rope points
    let d = `M ${pts[0].x} ${pts[0].y - 40} L ${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < SEGMENTS; i++) d += ` Q ${pts[i].x} ${pts[i].y} ${(pts[i].x + pts[i+1].x) / 2} ${(pts[i].y + pts[i+1].y) / 2}`;
    d += ` L ${pts[SEGMENTS].x} ${pts[SEGMENTS].y + 6}`;
    strap.setAttribute("d", d);
    if (!hasDragged) {
      const [, , BR, BL2] = corners();
      hint.style.left = `${(BR.x + BL2.x) / 2}px`; hint.style.top = `${Math.max(BR.y, BL2.y) + 22}px`;
      settled = Math.abs(cxv) + Math.abs(cyv) < 0.6 ? settled + 1 : 0;
      hint.classList.toggle("show", settled > 30);
    }
  }

  const loop = () => { step(); render(); requestAnimationFrame(loop); };

  // drag with mouse or finger
  const local = (e) => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  card.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    const p = local(e), [TL, TR, , BL] = corners();
    const ux = TR.x - TL.x, uy = TR.y - TL.y, vx = BL.x - TL.x, vy = BL.y - TL.y, rx = p.x - TL.x, ry = p.y - TL.y;
    drag = { u: clamp((rx * ux + ry * uy) / (W * W), 0, 1), v: clamp((rx * vx + ry * vy) / (H * H), 0, 1), ...p };
    card.classList.add("dragging"); card.setPointerCapture(e.pointerId);
    if (!hasDragged) { hasDragged = true; hint.classList.remove("show"); }
  });
  card.addEventListener("pointermove", (e) => { if (drag) Object.assign(drag, local(e)); });
  const release = () => { drag = null; card.classList.remove("dragging"); pts.forEach((p) => { p.px = lerp(p.px, p.x, 0.6); p.py = lerp(p.py, p.y, 0.6); }); };
  card.addEventListener("pointerup", release);
  card.addEventListener("pointercancel", release);

  // keep the strap attached when the window size changes
  addEventListener("resize", () => {
    if (!anchor) return;
    const nx = stage.clientWidth * CONFIG.anchorX, dx = nx - anchor.x;
    pts.forEach((p) => { p.x += dx; p.px += dx; }); anchor.x = nx; pts[0].x = pts[0].px = nx;
  });
  $("#replay").addEventListener("click", build);

  build(); render(); requestAnimationFrame(loop);
  </script>
</body>
</html>
