<!doctype html>
<!-- 3D "let's collab" goo button: Venom Button by exteestudio (MIT licence), see collab/LICENSE.
     This page only embeds it: a CSS pill shows first (and stays on phones and slow computers),
     the 3D version is loaded a few seconds later, only if the computer is fast enough. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aritra Tarafder · Collab button</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ===== Change the look here ===== */
    :root {
      --accent: #ff3b2f;
      --bg: #121110;
      --text: #fbf9f5;
      --muted: #a8a39b;
      --collab-bottom: 88px;   /* distance from the bottom of the screen to the middle of the button */
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg); }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Geist", system-ui, sans-serif; }
    .demo { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
    .demo h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 52px); font-weight: 600; letter-spacing: -0.055em; line-height: .95; }
    .demo p { margin: 0 auto; max-width: 36ch; color: var(--muted); line-height: 1.5; }
    #contact { min-height: 100vh; display: grid; place-items: center; background: #f7f5f1; color: #141312; font-size: 28px; font-weight: 600; letter-spacing: -0.04em; }

    /* The 3D layer: transparent, never catches the mouse, soft edges so it never looks like a box */
    .collab-frame {
      position: fixed; left: 50%; bottom: calc(var(--collab-bottom) - 280px);
      width: 680px; height: 560px; transform: translateX(-50%);
      border: 0; background: transparent; color-scheme: normal;
      pointer-events: none; z-index: 50; opacity: 0; transition: opacity .6s;
      -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 58%, transparent 100%);
              mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 58%, transparent 100%);
    }
    .collab-frame.show { opacity: 1; }

    /* The real link. First it is a glossy CSS pill; once the 3D button is live it becomes invisible
       and sits exactly over the 3D pill, so clicking and keyboard focus still work. */
    .collab {
      position: fixed; left: 50%; bottom: calc(var(--collab-bottom) - 30px);
      width: 170px; height: 60px; transform: translateX(-50%);
      display: grid; place-items: center; border-radius: 999px; z-index: 60;
      color: #eceef3; text-decoration: none; font: 700 19px/1 "Geist", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .collab .face {
      position: absolute; inset: 0; border-radius: inherit;
      background: radial-gradient(120% 140% at 30% 20%, #34343e, #0d0d11 62%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -6px 12px rgba(0,0,0,.5), 0 18px 30px -14px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.06);
      transition: opacity .5s, transform .3s;
    }
    .collab .label { position: relative; text-shadow: 0 1px 0 rgba(255,255,255,.2); transition: opacity .5s; }
    .collab:hover .face { transform: translateY(-2px); }
    .collab.is-3d .face, .collab.is-3d .label { opacity: 0; }
    .collab.is-3d:hover .face { transform: none; }
    .collab:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
    /* the 3D hand takes the place of the real cursor while it is over the goo */
    html.goo-engaged, html.goo-engaged * { cursor: none !important; }
  </style>
</head>
<body>
  <main class="demo">
    <div>
      <h1>Move your cursor toward the button</h1>
      <p>The 3D button appears a few seconds after the page loads. Click it to jump to the contact section.</p>
    </div>
  </main>
  <section id="contact">Contact section goes here</section>

  <a class="collab" id="collab" href="#contact"><span class="face" aria-hidden="true"></span><span class="label"></span></a>

  <script>
  /* ===== Change your details here ===== */
  const CONFIG = {
    label: "let’s collab",           // text on the button
    frameSrc: "collab/venom.html",   // the 3D button file
    delay: 3500,                     // ms to wait after the page loads before starting the 3D button
    slowKey: "aritra-goo-slow",      // remembers that this computer was too slow (to test again, add ?goo=force to the page address)
  };

  (() => {
    const link = document.getElementById("collab");
    link.querySelector(".label").textContent = CONFIG.label;

    const force = /[?&]goo=force/.test(location.search);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const touch = matchMedia("(hover: none), (pointer: coarse)").matches;
    let slow = false;
    try { slow = !force && localStorage.getItem(CONFIG.slowKey) === "1"; } catch (_) {}
    if (reduce || touch || slow) return;          // phones, reduced motion and slow computers keep the CSS pill

    let frame = null, layout = null, ready = false, alive = false;

    // put the real link exactly over the 3D pill
    function place() {
      if (!frame || !layout) return;
      const r = frame.getBoundingClientRect();
      link.style.cssText = `left:${r.left + layout.cx - layout.hw}px;top:${r.top + layout.cy - layout.hh}px;width:${layout.hw * 2}px;height:${layout.hh * 2}px;bottom:auto;transform:none`;
    }

    function drop(remember) {                      // go back to the CSS pill
      if (frame) frame.remove();
      frame = null; alive = false;
      if (remember) { try { localStorage.setItem(CONFIG.slowKey, "1"); } catch (_) {} }
    }

    function go() {                                // the 3D button is fast enough: show it
      alive = true;
      frame.classList.add("show");
      link.classList.add("is-3d");
      place();
      const post = (m) => { if (frame) frame.contentWindow.postMessage(m, "*"); };
      const send = (t, e) => {
        const r = frame.getBoundingClientRect();
        post({ venom: "ptr", t, x: e.clientX - r.left, y: e.clientY - r.top, pt: e.pointerType || "mouse" });
      };
      addEventListener("pointermove", (e) => frame && send("move", e), { passive: true });
      addEventListener("pointerdown", (e) => frame && send("down", e), { passive: true });
      addEventListener("pointerup", (e) => frame && send("up", e), { passive: true });
      document.documentElement.addEventListener("pointerleave", () => post({ venom: "ptr", t: "leave" }));
    }

    // speed test: after a short warm-up, time 20 frames. Slow computers go back to the CSS pill.
    function measure() {
      setTimeout(() => {
        if (!frame) return;
        const gaps = []; let last = performance.now();
        requestAnimationFrame(function tick(now) {
          gaps.push(now - last); last = now;
          if (gaps.length < 20) return requestAnimationFrame(tick);
          gaps.sort((a, b) => a - b);
          const median = gaps[gaps.length >> 1];
          if (median > 22) drop(true); else go();   // 22 ms per frame = below about 45 fps
        });
      }, 1200);
    }

    addEventListener("message", (e) => {
      if (!frame || e.source !== frame.contentWindow) return;
      const d = e.data;
      if (!d || !d.venom) return;
      if (d.venom === "layout") { layout = d; if (alive) place(); }
      else if (d.venom === "ready") { ready = true; measure(); }
      else if (d.venom === "engaged") document.documentElement.classList.toggle("goo-engaged", !!d.on);
    });
    addEventListener("resize", place);

    function start() {
      frame = document.createElement("iframe");
      frame.className = "collab-frame";
      frame.src = CONFIG.frameSrc + "?label=" + encodeURIComponent(CONFIG.label);
      frame.title = "3D button";
      frame.setAttribute("aria-hidden", "true");
      frame.tabIndex = -1;
      document.body.appendChild(frame);
      setTimeout(() => { if (!ready) drop(false); }, 8000);   // file missing or blocked: keep the CSS pill
    }
    setTimeout(() => ("requestIdleCallback" in window ? requestIdleCallback(start, { timeout: 2000 }) : start()), CONFIG.delay);
  })();
  </script>
</body>
</html>
